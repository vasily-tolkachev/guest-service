spring:
  application:
    name: quest-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${auth.jwt-validation.jwks-uri}
server:
  port: 8082
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
auth:
  jwt-validation:
    jwks-uri: ${AUTH_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
