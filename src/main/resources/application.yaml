spring:
  application:
    name: quest-service
  datasource:
    url: ${QUEST_DB_URL:jdbc:postgresql://localhost:5432/quest}
    username: ${QUEST_DB_USERNAME:quest}
    password: ${QUEST_DB_PASSWORD:quest}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${auth.jwt-validation.jwks-uri}
server:
  port: 8082
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
auth:
  jwt-validation:
    jwks-uri: ${AUTH_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
