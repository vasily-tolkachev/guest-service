spring:
  application:
    name: quest-service
  datasource:
    url: ${DB_URL:${QUEST_DB_URL:jdbc:postgresql://localhost:5432/mastery}}
    username: ${DB_USERNAME:${QUEST_DB_USERNAME:mastery}}
    password: ${DB_PASSWORD:${QUEST_DB_PASSWORD:mastery}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: quest
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: quest
    default-schema: quest
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${auth.jwt-validation.jwks-uri}
server:
  port: 8082
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
auth:
  jwt-validation:
    jwks-uri: ${AUTH_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:300000}
