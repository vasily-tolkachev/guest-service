name: Backend Build And Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  QUEST_IMAGE_NAME: ${{ github.repository_owner }}/mastery-quest

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build jars (skip tests)
        run: mvn -q -Dmaven.test.skip=true package

  docker-publish:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build jars (skip tests)
        run: mvn -q -Dmaven.test.skip=true package

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push quest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.QUEST_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.QUEST_IMAGE_NAME }}:latest

      - name: Trigger infrastructure deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/mastery-infrastructure
          event-type: backend-image-published
          client-payload: >-
            {"source_repo":"${{ github.repository }}","source_sha":"${{ github.sha }}","image":"${{ env.REGISTRY }}/${{ env.QUEST_IMAGE_NAME }}:${{ github.sha }}"}
